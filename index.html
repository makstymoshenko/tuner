<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,user-scalable=no"
    />
    <title>WebTuner</title>
    <link rel="stylesheet" href="misc/style.css" />
  </head>
  <body>
    <div class="tuner-page">
      <div class="tuner-container">
        <div class="tuner-panel">
          <div class="panel-body">
            <div class="note-display">
              <div class="notes">
                <div class="notes-list"></div>
                <div class="frequency">
                  <span class="frequency-value">0.0</span>
                  <span class="frequency-unit">Hz</span>
                </div>
                <div class="cents">
                  <span class="cents-value">0</span>
                  <span class="cents-label">cents</span>
                </div>
              </div>
            </div>
            <div class="meter-wrap">
              <div class="meter">
                <div class="meter-dot"></div>
                <div class="meter-pointer"></div>
              </div>
            </div>
            <div class="panel-controls">
              <div class="a4">
                A<sub>4</sub> = <span>440</span> Hz
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="misc/sweetalert2.all.min.js"></script>
    <script src="misc/aubio.min.js"></script>
    <script src="misc/tuner.js"></script>
    <script src="misc/meter.js"></script>
    <script src="misc/notes.js"></script>
    <script src="misc/app.js"></script>
  </body>
</html>
